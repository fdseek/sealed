name: "Build"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  # ─────────────────────────────────────────────────────────────
  # Test + Coverage
  # ─────────────────────────────────────────────────────────────
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: "stable"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libsqlite3-dev libgtk-3-dev libblkid-dev \
            liblzma-dev ninja-build cmake pkg-config lcov libsecret-1-dev libsecret-tools libsecret-1-0

      - name: Install Dependencies
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Run Tests with Coverage
        run: flutter test --coverage

      - name: Validate coverage report
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "❌ coverage/lcov.info not found."
            exit 1
          fi
          head -n 10 coverage/lcov.info

      - name: Generate HTML coverage report
        run: genhtml coverage/lcov.info --output-directory coverage/html

      - name: Get coverage percentage
        id: coverage
        run: |
          SUMMARY=$(lcov --summary coverage/lcov.info 2>&1)
          echo "$SUMMARY"
          COVERAGE=$(echo "$SUMMARY" | sed -n 's/.*lines\.\.\.\.\.\.: \([0-9.]*\)%.*/\1/p')
          if [ -z "$COVERAGE" ]; then
            echo "❌ Could not parse coverage"
            exit 1
          fi
          echo "Test Coverage: $COVERAGE%"
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Check coverage threshold (60%)
        run: |
          COVERAGE="${{ steps.coverage.outputs.coverage }}"
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "❌ Coverage ($COVERAGE%) below 60%"; exit 1
          fi
          echo "✅ Coverage ($COVERAGE%) OK"

      - name: Upload lcov.info
        uses: actions/upload-artifact@v4
        with:
          name: flutter-lcov-info
          path: coverage/lcov.info

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: flutter-html-coverage-report
          path: coverage/html

  # ─────────────────────────────────────────────────────────────
  # Android — split per ABI + universal
  # ─────────────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: "stable"

      - run: flutter pub get

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Build universal APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk

  # ─────────────────────────────────────────────────────────────
  # Linux AppImage via fastforge
  # ─────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: "stable"

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libsqlite3-dev libgtk-3-dev libblkid-dev \
            liblzma-dev ninja-build cmake pkg-config \
            libsecret-1-dev libsecret-1-0 libsecret-tools

      - name: Install appimagetool via setup-appimage
        uses: AnimMouse/setup-appimage@v2
        with:
          filename: appimagetool
          url: https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          cache_key: appimagetool-continuous

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get

      - name: Install fastforge
        run: |
          dart pub global activate fastforge
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Build AppImage
        run: fastforge release --name linux

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/**/*.AppImage

  # ─────────────────────────────────────────────────────────────
  # Windows
  # ─────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Zip Windows build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath windows-release.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: windows-release.zip
  # ─────────────────────────────────────────────────────────────
  # GitHub Release — only on tag push (v*)
  # ─────────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [ build-android, build-linux, build-windows ]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            artifacts/android-apks/*.apk
            artifacts/linux-appimage/**/*.AppImage
            artifacts/windows-release/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}